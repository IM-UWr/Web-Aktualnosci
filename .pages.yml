# Pages CMS — Web-Aktualnosci: Aktualności i obrony doktorskie.
# Wygenerowane przy migracji z Avean/IM-Website-test; pola „Opublikowany” usunięte (bez wersji roboczych).
# Zlecenie 33: pole „Opublikowane” wróciło w Stronach i na stronie działu (odznaczone = szkic, widoczny tylko na Podglądzie).
# Zlecenie 40: Strony w jawnym Markdownie (ukryte format_tresci), ściągawki przy Treści, tytuł EN i zajawka EN pod polskimi, etykiety „… EN”, opisy formularzy Aktualności i Obron, szablony Treści aktualności i obrony.
# Zlecenie 48: przełącznik „Opublikowane” w Aktualnościach, zaraz pod tytułem (odznaczone = szkic, widoczny tylko na Podglądzie).
# Media (22.11.2026): tylko własne foldery repozytorium. Na stronie pliki ze wszystkich repozytoriów są we wspólnym /pliki,
# a ten sam plik w dwóch repozytoriach zatrzymuje budowę; osobne foldery to wykluczają. Pilnuje skrypty/sprawdz_pola_cms.py (Web-Core).
media:
- name: aktualnosci
  label: 'Media: aktualności'
  input: public/pliki/aktualnosci
  output: /pliki/aktualnosci
  rename: safe
- name: obrony
  label: 'Media: obrony doktorskie'
  input: public/pliki/obrony
  output: /pliki/obrony
  rename: safe
settings:
  commit:
    identity: user
content:
- name: aktualnosci
  label: Aktualności
  description: Ogłoszenia, wydarzenia, sukcesy i oferty pracy, staży i stypendiów. Ogłoszenia, wydarzenia i sukcesy widać w Aktualnościach i na stronie głównej; wpis z terminem trafia też do kalendarza. Oferty (rodzaj „Kariera”) są na stronie Kariera i na stronie Studiów.
  type: collection
  path: src/content/aktualnosci
  format: yaml-frontmatter
  filename:
    template: '{year}-{month}-{day}-{primary}.md'
  view:
    fields:
    - tytul
    - data
    - rodzaj
    primary: tytul
    sort: [data]
    default:
      sort: data
      order: desc
  fields:
  - name: tytul
    label: Tytuł
    type: string
    required: true
  - name: tytul_en
    label: 'Tytuł EN'
    type: string
  - name: opublikowany
    label: Opublikowane — widoczne na stronie publicznej (na Podglądzie widać zawsze)
    description: Odznacz, żeby przygotować wpis bez pokazywania go na stronie publicznej (szkic).
    type: boolean
    default: true
  - name: data
    label: Data publikacji
    type: date
    required: true
    options:
      format: yyyy-MM-dd
  - name: rodzaj
    label: Rodzaj
    description: „Kariera” (oferty pracy, staży i stypendiów) trafia na stronę Kariera (link w Aktualnościach), a nie na listę Aktualności i stronę główną.
    type: select
    default: ogloszenie
    options:
      values:
      - name: ogloszenie
        label: Ogłoszenie
      - name: wydarzenie
        label: Wydarzenie
      - name: sukces
        label: Sukces
      - name: kariera
        label: Kariera
  - name: termin
    label: Termin wydarzenia (tylko spotkania, konferencje itp, ogólna informacja zostaw puste)
    description: Tylko jeśli wpis zapowiada wydarzenie (kliknij „Add an item”). Termin trafia do Kalendarza, do „Nadchodzących wydarzeń” i do Szybkiego dostępu na stronie głównej, a po jego końcu wpis znika z Aktualności na stronie głównej. Dzień, którego dotyczy zwykła informacja (np. dzień wręczenia medalu), wpisz w polu „Data”, nie tutaj.
    type: object
    list:
      max: 1
    fields:
    - name: dzien
      label: Dzień
      type: date
      required: true
      default: ''
    - name: godzina
      label: Godzina rozpoczęcia (np. 13:00; puste = cały dzień)
      type: string
      pattern:
        regex: ^(|([01]?[0-9]|2[0-3])[:.][0-5][0-9])$
        message: Wpisz godzinę w formacie 13:00
    - name: dzien_konca
      label: Dzień zakończenia (tylko wydarzenia wielodniowe)
      type: date
      default: ''
    - name: godzina_konca
      label: Godzina zakończenia (puste = 2 godziny po rozpoczęciu)
      type: string
      pattern:
        regex: ^(|([01]?[0-9]|2[0-3])[:.][0-5][0-9])$
        message: Wpisz godzinę w formacie 14:30
    - name: miejsce
      label: Miejsce (np. sala WS, Instytut Matematyczny UWr)
      type: string
    - name: pozycja
      type: boolean
      hidden: true
  - name: zgloszenia
    label: 'Termin zgłoszeń (tylko oferty: Rodzaj „Kariera”)'
    description: Tylko dla ofert pracy, staży i stypendiów (kliknij „Add an item”). Po tym dniu oferta przechodzi do „Zakończonych” na stronie Kariera i znika ze strony Studiów. Bez terminu oferta jest aktualna, dopóki jej nie usuniesz.
    type: object
    list:
      max: 1
    fields:
    - name: do_dnia
      label: Do dnia
      type: date
      required: true
      default: ''
    - name: pozycja
      type: boolean
      hidden: true
  - name: body
    label: Treść
    description: "Zwykły Markdown: akapity oddziela pusta linia; **pogrubienie**, *kursywa*, [tekst linku](https://…); lista: „- ” na początku linii; ## = nagłówek sekcji. Plik PDF: wgraj w „Media: aktualności” i w linku wpisz samą nazwę pliku: [tekst](nazwa.pdf) (z „Media: obrony doktorskie”: obrony/nazwa.pdf); plik z innego repozytorium: [tekst](Web-Nauka/nazwa.pdf). Po wgraniu sprawdź nazwę w Media: gdy taka już jest, CMS dopisze -1. Komentarze <!-- … --> to podpowiedzi; na stronie ich nie widać."
    type: code
    options:
      format: markdown
    default: |-
      <!-- TEKST: Zwykły tekst. Akapity oddziela pusta linia. Pliki: wgraj w „Media: aktualności” i w linku wpisz samą nazwę pliku: [tekst](nazwa.pdf) (z „Media: obrony doktorskie”: obrony/nazwa.pdf); plik z innego repozytorium: [tekst](Web-Nauka/nazwa.pdf). Po wgraniu sprawdź nazwę w Media: gdy taka już jest, CMS dopisze -1. -->
      <!-- Rejestracja, program, plakat: wstaw link w osobnej linii. -->
  - name: tresc_en
    label: Treść EN
    description: Treść po angielsku, w tym samym układzie co Treść. Puste = wersja angielska pokaże treść po polsku.
    type: code
    options:
      format: markdown
  - name: zajawka
    label: Zajawka (1–2 zdania na listę i stronę główną)
    type: text
  - name: zajawka_en
    label: 'Zajawka EN'
    type: text
  - name: dla
    label: Dla kogo
    type: select
    options:
      multiple: true
      values:
      - name: studenci
        label: Studenci
      - name: doktoranci
        label: Doktoranci
      - name: pracownicy
        label: Pracownicy
      - name: kandydaci
        label: Kandydaci
  - name: zdjecie
    label: Zdjęcie główne
    type: image
    options:
      media: aktualnosci
      path: public/pliki/aktualnosci
  - name: zdjecie_opis
    label: Podpis / opis zdjęcia (np. kto jest na zdjęciu, autor)
    type: string
  - name: zdjecie_opis_en
    label: 'Podpis / opis zdjęcia EN (np. Photo: Jan Kowalski)'
    type: string
  - name: galeria
    label: Galeria zdjęć
    type: object
    list:
      collapsible:
        collapsed: true
        summary: "{index}. {podpis}"
    fields:
    - name: plik
      label: Zdjęcie
      description: Wymagane. Jeśli nie chcesz zdjęcia, usuń tę pozycję ikoną kosza.
      type: image
      required: true
      options:
        media: aktualnosci
        path: public/pliki/aktualnosci
    - name: podpis
      label: Podpis
      type: string
    - name: podpis_en
      label: Podpis EN
      type: string
    - name: pozycja
      type: boolean
      hidden: true
  - name: album
    label: Link do pełnego albumu (np. Google Photos, Flickr)
    type: string
  - name: zalaczniki
    label: Załączniki (PDF itp.)
    type: object
    list:
      collapsible:
        collapsed: true
        summary: "{nazwa}"
    fields:
    - name: nazwa
      label: Nazwa wyświetlana
      type: string
    - name: nazwa_en
      label: 'Nazwa wyświetlana EN (plik po polsku — np. Job offer (PDF, Polish))'
      type: string
    - name: plik
      label: Plik
      description: Wymagane. Jeśli nie chcesz załącznika, usuń tę pozycję ikoną kosza.
      type: file
      required: true
      options:
        media: aktualnosci
        path: public/pliki/aktualnosci
    - name: pozycja
      type: boolean
      hidden: true
  - name: zaklad
    label: Zakład (opcjonalnie — wpis pojawi się też na stronie zakładu)
    type: select
    options:
      values: &id001
      - name: algebra-i-teoria-modeli
        label: Zakład Algebry i Teorii Modeli
      - name: analiza-funkcjonalna
        label: Zakład Analizy Funkcjonalnej
      - name: analiza-matematyczna
        label: Zakład Analizy Matematycznej
      - name: dydaktyka
        label: Pracownia Dydaktyki i Popularyzacji Matematyki
      - name: geometria
        label: Zakład Geometrii
      - name: rownania-rozniczkowe
        label: Zakład Równań Różniczkowych
      - name: statystyka
        label: Zakład Statystyki
      - name: teoria-mnogosci-i-topologia
        label: Zakład Teorii Mnogości i Topologii
      - name: teoria-prawdopodobienstwa
        label: Zakład Teorii Prawdopodobieństwa
    description: (lista z innego repozytorium — nowa pozycja wymaga dopisania w konfiguracji)
- name: obrony
  label: Obrony doktorskie
  description: Publiczne obrony rozpraw doktorskich. Lista w Nauce → Obrony doktorskie. Pusta Treść = strona sama napisze zaproszenie.
  type: collection
  path: src/content/obrony
  format: yaml-frontmatter
  filename:
    template: '{year}-{month}-{day}-{primary}.md'
  view:
    fields:
    - kandydat
    - termin
    primary: kandydat
    sort: [termin]
    default:
      sort: termin
      order: desc
  fields:
  - name: kandydat
    label: Imię i nazwisko doktoranta
    type: string
    required: true
  - name: tytul_rozprawy
    label: Tytuł rozprawy
    type: string
    required: true
  - name: termin
    label: Termin obrony
    type: date
    required: true
    options:
      time: true
      format: yyyy-MM-dd'T'HH:mm
  - name: miejsce
    label: Miejsce
    type: string
    default: sala WS, Instytut Matematyczny UWr
  - name: body
    label: Opis (opcjonalnie; puste = zaproszenie, a po terminie informacja o odbytej obronie, złożone z danych. Wpisany tekst nie zmieni się sam po terminie)
    description: "Zwykły Markdown: akapity oddziela pusta linia; **pogrubienie**, *kursywa*, [tekst linku](https://…); lista: „- ” na początku linii; ## = nagłówek sekcji. Plik PDF: wgraj w „Media: aktualności” i w linku wpisz samą nazwę pliku: [tekst](nazwa.pdf) (z „Media: obrony doktorskie”: obrony/nazwa.pdf); plik z innego repozytorium: [tekst](Web-Nauka/nazwa.pdf). Po wgraniu sprawdź nazwę w Media: gdy taka już jest, CMS dopisze -1. Komentarze <!-- … --> to podpowiedzi; na stronie ich nie widać. Pusta Treść (albo sam komentarz) = zaproszenie złożone z danych."
    type: code
    options:
      format: markdown
    default: <!-- Zostaw puste, a strona sama napisze zaproszenie. Własny tekst zastępuje zaproszenie. -->
  - name: tresc_en
    label: Treść EN
    description: Opis po angielsku, w tym samym układzie. Puste = wersja angielska pokaże zaproszenie złożone z danych (także wtedy, gdy polski opis jest wpisany).
    type: code
    options:
      format: markdown
  - name: zdjecie
    label: Zdjęcie (opcjonalne; puste = domyślna grafika obrony)
    type: image
    options:
      media: aktualnosci
      path: public/pliki/aktualnosci
  - name: zdjecie_opis
    label: Podpis / opis zdjęcia
    type: string
  - name: zdjecie_opis_en
    label: 'Podpis / opis zdjęcia EN'
    type: string
  - name: promotorzy
    label: Promotor / promotorzy
    type: string
    list: true
  - name: data_ogloszenia
    label: Data ogłoszenia (pozycja na liście aktualności)
    type: date
    default: ""
    options:
      format: yyyy-MM-dd
  - name: w_aktualnosciach
    label: Pokaż też w aktualnościach
    type: boolean
    default: true
  - name: zawiadomienie
    label: Zawiadomienie o obronie (PDF)
    type: file
    options:
      media: obrony
      path: public/pliki/obrony
  - name: rozprawa
    label: Rozprawa doktorska (PDF)
    type: file
    options:
      media: obrony
      path: public/pliki/obrony
  - name: streszczenie_pl
    label: Streszczenie po polsku (PDF)
    type: file
    options:
      media: obrony
      path: public/pliki/obrony
  - name: streszczenie_en
    label: Streszczenie po angielsku (PDF)
    type: file
    options:
      media: obrony
      path: public/pliki/obrony
  - name: recenzje
    label: Recenzje
    type: object
    list:
      collapsible:
        collapsed: true
        summary: "{recenzent}"
    fields:
    - name: recenzent
      label: Recenzent (np. prof. dr hab. Jan Kowalski)
      type: string
      required: true
    - name: plik
      label: Recenzja (PDF)
      description: Wymagane (recenzja w PDF). Jeśli recenzji jeszcze nie ma, usuń tę pozycję ikoną kosza.
      type: file
      required: true
      options:
        media: obrony
        path: public/pliki/obrony
    - name: pozycja
      type: boolean
      hidden: true
  - name: bip
    label: Link do ogłoszenia w BIP (opcjonalnie)
    type: string
  - name: zaklad
    label: Zakład (opcjonalnie)
    type: select
    options:
      values: *id001
    description: (lista z innego repozytorium — nowa pozycja wymaga dopisania w konfiguracji)
- name: strony
  label: Strony
  description: 'Adres strony = ścieżka pliku, np. aktualnosci.md → /aktualnosci. Teksty stron z listą (tytuł, opis, hasło i tekst nad listą) to też strony: aktualnosci.md (Aktualności), kariera.md (Kariera, strona /aktualnosci/kariera z ofertami pracy, staży i stypendiów), obrony-doktorskie.md (Obrony doktorskie). Brak takiej strony nic nie psuje — lista pokaże domyślny tytuł i hasło, bez tekstu. Treść w jawnym Markdownie, jak w Studiach.'
  type: collection
  path: src/content/strony
  format: yaml-frontmatter
  subfolders: true
  filename: '{primary}.md'
  view:
    fields:
    - tytul
    primary: tytul
  fields:
  - name: tytul
    label: Tytuł
    type: string
    required: true
  - name: tytul_en
    label: Tytuł EN
    type: string
  - name: opublikowany
    label: Opublikowane — widoczne na stronie publicznej (na Podglądzie widać zawsze)
    description: Odznacz, żeby przygotować stronę bez pokazywania jej na stronie publicznej (szkic)
    type: boolean
    default: true
  - name: body
    label: Treść
    type: code
    options:
      format: markdown
    description: |-
      Jawny Markdown: ## rozpoczyna sekcję i pozycję spisu; {#id} zachowuje adres sekcji. Zwykły tekst jest prozą domyślnie; nie wymaga otaczających znaczników. Specjalne układy wymagają znaczników, np. :::kafelki, :::etapy, :::zakladki. Komentarze <!-- … --> objaśniają bloki; na stronie ich nie widać. Zachowaj pasujące końcowe dwukropki. Plik PDF: wgraj w „Media: aktualności” i w linku wpisz samą nazwę pliku: [tekst](nazwa.pdf) (z „Media: obrony doktorskie”: obrony/nazwa.pdf); plik z innego repozytorium: [tekst](Web-Nauka/nazwa.pdf). Po wgraniu sprawdź nazwę w Media: gdy taka już jest, CMS dopisze -1. Wygląd sprawdzaj po przebudowaniu strony (Podgląd). Strona z listą (Aktualności, Kariera, Obrony doktorskie): tekst stoi nad listą; pusta Treść (albo sam komentarz) = sama lista.
  - name: tresc_en
    label: Treść EN
    description: "Jawny Markdown: ## rozpoczyna sekcję i pozycję spisu; {#id} zachowuje adres sekcji. Zwykły tekst jest prozą domyślnie; nie wymaga otaczających znaczników. Specjalne układy wymagają znaczników, np. :::kafelki, :::etapy, :::zakladki. Komentarze <!-- … --> objaśniają bloki; na stronie ich nie widać. Zachowaj pasujące końcowe dwukropki. Plik PDF: wgraj w „Media: aktualności” i w linku wpisz samą nazwę pliku: [tekst](nazwa.pdf) (z „Media: obrony doktorskie”: obrony/nazwa.pdf); plik z innego repozytorium: [tekst](Web-Nauka/nazwa.pdf). Po wgraniu sprawdź nazwę w Media: gdy taka już jest, CMS dopisze -1. Wygląd sprawdzaj po przebudowaniu strony (Podgląd). Puste = strona angielska pokaże treść polską."
    type: code
    options:
      format: markdown
  - name: format_tresci
    label: Format treści
    type: string
    hidden: true
    default: jawne
  - name: opis
    label: Krótki opis (Google i podgląd linku)
    description: Na samej stronie się nie wyświetla (baner pokazuje tytuł i hasło). Np. „Ogłoszenia, wydarzenia i sukcesy Instytutu Matematycznego.”. Puste = ogólny opis serwisu.
    type: text
  - name: opis_en
    label: 'Opis EN'
    type: text
  - name: haslo
    label: Hasło na banerze (jedna linia; liczby w banerze pokażą się tylko razem z hasłem)
    type: string
  - name: haslo_en
    label: 'Hasło na banerze EN'
    type: string
  - name: haslo_podstron
    label: Hasło na banerze stron pojedynczych wpisów (tylko Publikacje — rocznik, i Obrony doktorskie — obrona)
    type: string
  - name: haslo_podstron_en
    label: 'Hasło stron pojedynczych wpisów EN'
    type: string
  - name: liczby
    label: Liczby pod hasłem na banerze (tylko gdy nie da się ich policzyć z danych)
    type: object
    list:
      collapsible:
        collapsed: true
        summary: "{n} {etykieta}"
    fields:
    - name: n
      label: Liczba (np. 8 albo 3 lata)
      type: string
      required: true
    - name: n_en
      label: 'Liczba EN (puste = jak po polsku)'
      type: string
    - name: etykieta
      label: Podpis
      type: string
      required: true
    - name: etykieta_en
      label: 'Podpis EN'
      type: string
    - name: pozycja
      type: boolean
      hidden: true
  - name: pasek_boczny
    label: 'Prawy pasek: spis „Na tej stronie”, menu działu czy oba (puste = domyślnie tylko spis)'
    type: select
    options:
      values:
      - name: oba
        label: Oba (spis i menu działu)
      - name: spis
        label: Tylko spis „Na tej stronie”
      - name: menu
        label: Tylko menu działu (podstrony)
      - name: brak
        label: Bez prawego paska (strona na całą szerokość)
  - name: bloki
    label: Kafelki, oś i kontakty z list — zob. ściągawka
    type: boolean
    default: false
    description: 'Włączone: listy w treści stają się blokami (kafelki, oś kroków, kontakty, lista plików, rozwijane pytania) — opis przy polu „Treść”. Wyłączone: zwykłe listy.'
    hidden: true
