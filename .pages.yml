# Pages CMS — Web-Aktualnosci: Aktualności i obrony doktorskie.
# Wygenerowane przy migracji z Avean/IM-Website-test; pola „Opublikowany” usunięte (bez wersji roboczych).
# Zlecenie 33: pole „Opublikowane” wróciło w Stronach i na stronie działu (odznaczone = szkic, widoczny tylko na Podglądzie).
media:
  input: public/pliki
  output: /pliki
  rename: safe
settings:
  commit:
    identity: user
content:
- name: aktualnosci
  label: Aktualności
  type: collection
  path: src/content/aktualnosci
  format: yaml-frontmatter
  filename:
    template: '{year}-{month}-{day}-{primary}.md'
  view:
    fields:
    - tytul
    - data
    - rodzaj
    primary: tytul
    sort: [data]
    default:
      sort: data
      order: desc
  fields:
  - name: tytul
    label: Tytuł
    type: string
    required: true
  - name: data
    label: Data publikacji
    type: date
    required: true
    options:
      format: yyyy-MM-dd
  - name: rodzaj
    label: Rodzaj
    type: select
    default: ogloszenie
    options:
      values:
      - name: ogloszenie
        label: Ogłoszenie
      - name: wydarzenie
        label: Wydarzenie
      - name: sukces
        label: Sukces
      - name: kariera
        label: Kariera
  - name: termin
    label: Termin wydarzenia
    description: Tylko jeśli wpis zapowiada wydarzenie (kliknij „Add an item”). Termin trafia do Kalendarza, do „Nadchodzących wydarzeń” i do Szybkiego dostępu na stronie głównej, a po jego końcu wpis znika z Aktualności na stronie głównej. Dzień, którego dotyczy zwykła informacja (np. dzień wręczenia medalu), wpisz w polu „Data”, nie tutaj.
    type: object
    list:
      max: 1
    fields:
    - name: dzien
      label: Dzień
      type: date
      required: true
      default: ''
    - name: godzina
      label: Godzina rozpoczęcia (np. 13:00; puste = cały dzień)
      type: string
      pattern:
        regex: ^(|([01]?[0-9]|2[0-3])[:.][0-5][0-9])$
        message: Wpisz godzinę w formacie 13:00
    - name: dzien_konca
      label: Dzień zakończenia (tylko wydarzenia wielodniowe)
      type: date
      default: ''
    - name: godzina_konca
      label: Godzina zakończenia (puste = 2 godziny po rozpoczęciu)
      type: string
      pattern:
        regex: ^(|([01]?[0-9]|2[0-3])[:.][0-5][0-9])$
        message: Wpisz godzinę w formacie 14:30
    - name: miejsce
      label: Miejsce (np. sala WS, Instytut Matematyczny UWr)
      type: string
    - name: pozycja
      type: boolean
      hidden: true
  - name: body
    label: Treść
    type: code
    options:
      format: markdown
  - name: tresc_en
    label: Treść EN
    description: Treść po angielsku, w tym samym układzie co Treść. Puste = wersja angielska pokaże treść po polsku.
    type: code
    options:
      format: markdown
  - name: dla
    label: Dla kogo
    type: select
    options:
      multiple: true
      values:
      - name: studenci
        label: Studenci
      - name: doktoranci
        label: Doktoranci
      - name: pracownicy
        label: Pracownicy
      - name: kandydaci
        label: Kandydaci
  - name: zajawka
    label: Zajawka (1–2 zdania na listę i stronę główną)
    type: text
  - name: zdjecie
    label: Zdjęcie główne
    type: image
    options:
      path: public/pliki/aktualnosci
  - name: zdjecie_opis
    label: Podpis / opis zdjęcia (np. kto jest na zdjęciu, autor)
    type: string
  - name: zdjecie_opis_en
    label: 'EN: podpis / opis zdjęcia (np. Photo: Jan Kowalski)'
    type: string
  - name: galeria
    label: Galeria zdjęć
    type: object
    list:
      collapsible:
        collapsed: true
        summary: "{index}. {podpis}"
    fields:
    - name: plik
      label: Zdjęcie
      description: Wymagane. Jeśli nie chcesz zdjęcia, usuń tę pozycję ikoną kosza.
      type: image
      required: true
      options:
        path: public/pliki/aktualnosci
    - name: podpis
      label: Podpis
      type: string
    - name: pozycja
      type: boolean
      hidden: true
  - name: album
    label: Link do pełnego albumu (np. Google Photos, Flickr)
    type: string
  - name: zalaczniki
    label: Załączniki (PDF itp.)
    type: object
    list:
      collapsible:
        collapsed: true
        summary: "{nazwa}"
    fields:
    - name: nazwa
      label: Nazwa wyświetlana
      type: string
    - name: nazwa_en
      label: 'EN: nazwa wyświetlana (plik po polsku — np. Job offer (PDF, Polish))'
      type: string
    - name: plik
      label: Plik
      description: Wymagane. Jeśli nie chcesz załącznika, usuń tę pozycję ikoną kosza.
      type: file
      required: true
      options:
        path: public/pliki/aktualnosci
    - name: pozycja
      type: boolean
      hidden: true
  - name: zaklad
    label: Zakład (opcjonalnie — wpis pojawi się też na stronie zakładu)
    type: select
    options:
      values: &id001
      - name: algebra-i-teoria-modeli
        label: Zakład Algebry i Teorii Modeli
      - name: analiza-funkcjonalna
        label: Zakład Analizy Funkcjonalnej
      - name: analiza-matematyczna
        label: Zakład Analizy Matematycznej
      - name: dydaktyka
        label: Pracownia Dydaktyki i Popularyzacji Matematyki
      - name: geometria
        label: Zakład Geometrii
      - name: rownania-rozniczkowe
        label: Zakład Równań Różniczkowych
      - name: statystyka
        label: Zakład Statystyki
      - name: teoria-mnogosci-i-topologia
        label: Zakład Teorii Mnogości i Topologii
      - name: teoria-prawdopodobienstwa
        label: Zakład Teorii Prawdopodobieństwa
    description: (lista z innego repozytorium — nowa pozycja wymaga dopisania w konfiguracji)
  - name: tytul_en
    label: 'EN: tytuł'
    type: string
  - name: zajawka_en
    label: 'EN: zajawka'
    type: text
- name: obrony
  label: Obrony doktorskie
  type: collection
  path: src/content/obrony
  format: yaml-frontmatter
  filename:
    template: '{year}-{month}-{day}-{primary}.md'
  view:
    fields:
    - kandydat
    - termin
    primary: kandydat
    sort: [termin]
    default:
      sort: termin
      order: desc
  fields:
  - name: kandydat
    label: Imię i nazwisko doktoranta
    type: string
    required: true
  - name: tytul_rozprawy
    label: Tytuł rozprawy
    type: string
    required: true
  - name: termin
    label: Termin obrony
    type: date
    required: true
    options:
      time: true
      format: yyyy-MM-dd'T'HH:mm
  - name: miejsce
    label: Miejsce
    type: string
    default: sala WS, Instytut Matematyczny UWr
  - name: body
    label: Opis (opcjonalnie; puste = zaproszenie, a po terminie informacja o odbytej obronie, złożone z danych. Wpisany tekst nie zmieni się sam po terminie)
    type: code
    options:
      format: markdown
  - name: tresc_en
    label: Treść EN
    description: Opis po angielsku, w tym samym układzie. Puste = wersja angielska pokaże zaproszenie złożone z danych (albo opis po polsku, gdy jest).
    type: code
    options:
      format: markdown
  - name: zdjecie
    label: Zdjęcie (opcjonalne; puste = domyślna grafika obrony)
    type: image
    options:
      path: public/pliki/aktualnosci
  - name: zdjecie_opis
    label: Podpis / opis zdjęcia
    type: string
  - name: zdjecie_opis_en
    label: 'EN: podpis / opis zdjęcia'
    type: string
  - name: promotorzy
    label: Promotor / promotorzy
    type: string
    list: true
  - name: data_ogloszenia
    label: Data ogłoszenia (pozycja na liście aktualności)
    type: date
    default: ""
    options:
      format: yyyy-MM-dd
  - name: w_aktualnosciach
    label: Pokaż też w aktualnościach
    type: boolean
    default: true
  - name: zawiadomienie
    label: Zawiadomienie o obronie (PDF)
    type: file
    options:
      path: public/pliki/obrony
  - name: rozprawa
    label: Rozprawa doktorska (PDF)
    type: file
    options:
      path: public/pliki/obrony
  - name: streszczenie_pl
    label: Streszczenie po polsku (PDF)
    type: file
    options:
      path: public/pliki/obrony
  - name: streszczenie_en
    label: Streszczenie po angielsku (PDF)
    type: file
    options:
      path: public/pliki/obrony
  - name: recenzje
    label: Recenzje
    type: object
    list:
      collapsible:
        collapsed: true
        summary: "{recenzent}"
    fields:
    - name: recenzent
      label: Recenzent (np. prof. dr hab. Jan Kowalski)
      type: string
      required: true
    - name: plik
      label: Recenzja (PDF)
      description: Wymagane (recenzja w PDF). Jeśli recenzji jeszcze nie ma, usuń tę pozycję ikoną kosza.
      type: file
      required: true
      options:
        path: public/pliki/obrony
    - name: pozycja
      type: boolean
      hidden: true
  - name: bip
    label: Link do ogłoszenia w BIP (opcjonalnie)
    type: string
  - name: zaklad
    label: Zakład (opcjonalnie)
    type: select
    options:
      values: *id001
    description: (lista z innego repozytorium — nowa pozycja wymaga dopisania w konfiguracji)
- name: strony
  label: Strony
  description: 'Adres strony = ścieżka pliku, np. aktualnosci.md → /aktualnosci. Teksty stron z listą (tytuł, opis, hasło i tekst nad listą) to też strony: aktualnosci.md (Aktualności), obrony-doktorskie.md (Obrony doktorskie). Brak takiej strony nic nie psuje — lista pokaże domyślny tytuł i hasło, bez tekstu.'
  type: collection
  path: src/content/strony
  format: yaml-frontmatter
  subfolders: true
  filename: '{primary}.md'
  view:
    fields:
    - tytul
    primary: tytul
  fields:
  - name: tytul
    label: Tytuł
    type: string
    required: true
  - name: opublikowany
    label: Opublikowane — widoczne na stronie publicznej (na Podglądzie widać zawsze)
    description: Odznacz, żeby przygotować stronę bez pokazywania jej na stronie publicznej (szkic)
    type: boolean
    default: true
  - name: body
    label: Treść
    type: code
    options:
      format: markdown
    description: |-
      Piszesz jak w zwykłym edytorze; akapity oddziela Enter. Nagłówek 2 = nowa sekcja (pojawi się w spisie „Na tej stronie”).

      Gdy włączone jest pole „Bloki” (niżej), kilka układów strona rozpoznaje sama:

      • Punkt listy zaczynający się pogrubieniem = kafelek.

      • Lista numerowana z pogrubionym początkiem = oś kroków.

      • Punkt z rolą kursywą i nazwiskiem pogrubionym = kontakt.

      • Lista samych linków = lista plików (PDF / strona).

      • Nagłówek 3 zakończony znakiem „?” = rozwijane pytanie.

      • Tekst nad listą (Seminaria, Konferencje, Aktualności…): lista stoi pod całym tekstem, chyba że jest kotwica — np. na stronie Publikacje tekst pod nagłówkiem 2 „Czasopisma redagowane w Instytucie” stoi nad listą czasopism.

      • Plik PDF: wgraj w „Media” i wklej link.

      • Akapit zaczynający się od dwuliterowego skrótu z kropką („Np.”, „Dr.”, „No.”) edytor zapisze jako listę numerowaną „1.” — zacznij akapit inaczej albo pogrub skrót.

      Więcej: ściągawka edytora (dok/sciagawka-edytora.md w Web-Core).
  - name: tytul_en
    label: Tytuł EN
    type: string
  - name: tresc_en
    label: Treść EN
    description: Cała strona po angielsku, w tym samym układzie co Treść (nagłówki sekcji po angielsku). Puste = strona angielska pokaże treść polską.
    type: code
    options:
      format: markdown
  - name: opis
    label: Krótki opis (pod tytułem i w Google)
    type: text
  - name: opis_en
    label: 'EN: opis'
    type: text
  - name: haslo
    label: Hasło na banerze (jedna linia; liczby w banerze pokażą się tylko razem z hasłem)
    type: string
  - name: haslo_en
    label: 'EN: hasło na banerze'
    type: string
  - name: haslo_podstron
    label: Hasło na banerze stron pojedynczych wpisów (tylko Publikacje — rocznik, i Obrony doktorskie — obrona)
    type: string
  - name: haslo_podstron_en
    label: 'EN: hasło stron pojedynczych wpisów'
    type: string
  - name: liczby
    label: Liczby pod hasłem na banerze (tylko gdy nie da się ich policzyć z danych)
    type: object
    list:
      collapsible:
        collapsed: true
        summary: "{n} {etykieta}"
    fields:
    - name: n
      label: Liczba (np. 8 albo 3 lata)
      type: string
      required: true
    - name: n_en
      label: 'EN: liczba (puste = jak po polsku)'
      type: string
    - name: etykieta
      label: Podpis
      type: string
      required: true
    - name: etykieta_en
      label: 'EN: podpis'
      type: string
    - name: pozycja
      type: boolean
      hidden: true
  - name: pasek_boczny
    label: 'Prawy pasek: spis „Na tej stronie”, menu działu czy oba (puste = domyślnie tylko spis)'
    type: select
    options:
      values:
      - name: oba
        label: Oba (spis i menu działu)
      - name: spis
        label: Tylko spis „Na tej stronie”
      - name: menu
        label: Tylko menu działu (podstrony)
      - name: brak
        label: Bez prawego paska (strona na całą szerokość)
  - name: bloki
    label: Kafelki, oś i kontakty z list — zob. ściągawka
    type: boolean
    default: false
    description: 'Włączone: listy w treści stają się blokami (kafelki, oś kroków, kontakty, lista plików, rozwijane pytania) — opis przy polu „Treść”. Wyłączone: zwykłe listy.'
